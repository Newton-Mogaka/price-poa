server {
    listen 80;
    server_name pricepoa.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'nginx is up, waiting for cert';
        add_header Content-Type text/plain;
    }
}

